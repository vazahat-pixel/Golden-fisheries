# Production site for goldenfisheries.in
# Install once on the VPS:
#   sudo cp deploy/nginx/goldenfisheries.conf /etc/nginx/sites-available/goldenfisheries
#   sudo ln -sf /etc/nginx/sites-available/goldenfisheries /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Frontend static files live in /var/www/goldenfisheries (synced by scripts/deploy-production.sh).
# API + Socket.IO are proxied to the Node backend on port 5000.

server {
    listen 80;
    listen [::]:80;
    server_name goldenfisheries.in www.goldenfisheries.in;

    location /.well-known/acme-challenge/ {
        root /var/www/goldenfisheries;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name goldenfisheries.in www.goldenfisheries.in;

    root /var/www/goldenfisheries;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/goldenfisheries.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenfisheries.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}
